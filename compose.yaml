services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup first}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: HighlandsCoffeeDB
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - highlands-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u root -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 30
    restart: unless-stopped
volumes:
  highlands-mysql:
