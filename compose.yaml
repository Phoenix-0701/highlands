services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run npm run setup first}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - highlands-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q ''SELECT 1'' -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15
    restart: unless-stopped
volumes:
  highlands-sql:
